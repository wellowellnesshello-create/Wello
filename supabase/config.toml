# Wello function configuration.
#
# Only functions that need to be publicly reachable (i.e. hit from a
# non-authenticated browser or a third-party webhook source) opt out of JWT
# verification here. Anything not listed keeps the platform default.

[functions.studio-cancel-booking]
# Tapped from a WhatsApp/SMS message on the studio's phone. No Wello session
# on that device — auth is handled inside the function by verifying the HMAC
# signature on the token in the URL.
verify_jwt = false

[functions.booking-safety-alert]
# Invoked by the client (browser) after a booking is inserted. The client
# has a JWT so verification could stay on, but keeping it off matches the
# invocation pattern already used by notify-instructor-sms / bookings-sync.
verify_jwt = false

[functions.stripe-webhook]
# Stripe cannot send a Supabase JWT. Auth is handled inside the function
# by verifying Stripe's HMAC signature (stripe-signature header) against
# STRIPE_WEBHOOK_SECRET. Without this line the platform default rejects
# every Stripe webhook at 401 before the function ever runs, so Supabase's
# log viewer shows nothing and credits fail to land after a paid checkout.
verify_jwt = false

[functions.venue-booking-response]
# Public HMAC-tokened accept/decline link — the venue clicks it from their
# email, no Wello session on that device. Auth is handled inside the
# function by verifying the HMAC signature on the token (same pattern as
# studio-cancel-booking). The auto_decline JSON POST path is
# authenticated by an X-Cron-Token header matching CRON_INVOKE_SECRET
# (same shared secret used by auto-decline-stale-bookings).
verify_jwt = false

[functions.auto-decline-stale-bookings]
# Called hourly by pg_cron via pg_net. The Supabase gateway only accepts
# publishable / legacy JWT keys on function URLs (sb_secret_ is rejected),
# so after the legacy anon/service_role disable there's no gateway-side
# credential available to a scheduled job that isn't also public. Bypass
# gateway auth here and enforce a shared header check inside the function
# using CRON_INVOKE_SECRET. The cron command reads the same value from
# Vault so it never appears in plaintext in cron.job.command.
verify_jwt = false

[functions.run-weekly-payouts]
# Same sb_secret_ gateway rejection as auto-decline-stale-bookings — the
# service_role token path in the function body is unreachable when Kong
# rejects sb_secret_ before dispatch. Bypass gateway auth and let the
# function's own authorise() gate (service_role literal OR admin-allowlist
# JWT) decide. Belt and braces: without this, calling run-weekly-payouts
# with a Bearer sb_secret_ returns 401 at the gateway and the function
# never runs.
verify_jwt = false

[functions.instructor-booking-response]
# Same reason as venue-booking-response: the auto_decline path is called
# server-to-server by auto-decline-stale-bookings via
# supabase.functions.invoke, which sends SUPABASE_SERVICE_ROLE_KEY (now
# sb_secret_) as Bearer — but the gateway rejects sb_secret_ on function
# URLs. Bypass gateway auth and enforce per-action checks inside the
# function: user JWT for confirm/decline, X-Cron-Token for auto_decline.
verify_jwt = false

[functions.redeem-partner-invite]
# Public. The partner clicks a wello-domain invite URL with no Wello session
# yet, so we can't require a JWT. Auth is provided by the invite code
# itself — 144-bit random, single-use, TTL enforced in the function.
verify_jwt = false

[functions.backfill-geocodes]
# Fired by the AFTER-trigger on businesses.address (via pg_net) which
# only has an X-Admin-Token header, not a Supabase JWT. Also invoked by
# the admin panel with a real user JWT for on-demand runs — that path
# still goes through requireAdmin so the allowlist check applies.
# verify_jwt=false only removes the platform-level gateway check.
verify_jwt = false

[functions.geocode-address]
# Same reason — invoked from the client with a user JWT for immediate
# feedback, and (indirectly, via backfill-geocodes) from pg_net. The
# in-function requireAdmin still gates writes.
verify_jwt = false

[functions.notify-venue-rental-request]
# Invoked from the customer's signed-in browser after inserting a
# rental booking. Auth is enforced inside via getUser(token) against
# the booking's user_id — the gateway JWT check is redundant.
verify_jwt = false

[functions.notify-venue-instant-booking]
# Fired from the customer's signed-in browser after an instant-book
# class confirms. Same auth pattern as the rental/slot notify fns —
# getUser(token) verifies the caller owns the booking.
verify_jwt = false

[functions.booqable-sync]
# Server-to-server only (venue-booking-response, and eventually a
# cron for reconciliation). Requires the caller to hold the service-
# role key; explicit Bearer check inside. Not user-callable.
verify_jwt = false

[functions.send-booking-reminders]
# Called hourly by pg_cron via pg_net with an X-Cron-Token header. Same
# reason as auto-decline-stale-bookings — the gateway rejects
# sb_secret_ tokens, so the platform JWT check is bypassed and the
# function enforces its own shared-secret gate against
# CRON_INVOKE_SECRET.
verify_jwt = false

[functions.send-setup-reminders]
# Called daily by pg_cron via pg_net with an X-Cron-Token header. Same
# reason as the other cron-invoked fns — sb_secret_ rejection at the
# gateway. The fn enforces its own shared-secret gate.
verify_jwt = false

# extract-sessions intentionally has NO override here — it keeps the platform
# default (verify_jwt = true). The admin timetable-upload tool is gated
# client-side by VITE_ADMIN_SETUP_ENABLED + a ?admin=setup URL param, and the
# JWT requirement adds a second layer so nobody can hit the function with an
# unauthenticated fetch.
