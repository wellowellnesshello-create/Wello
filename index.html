<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#213C18" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wello is your wellness pass for Mallorca. Yoga, pilates, gyms, spas and private instructors with one membership." />
    <link rel="canonical" href="https://www.wello-wellness.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — WhatsApp / Facebook / LinkedIn link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wello" />
    <meta property="og:title" content="Wello — one wellness pass for Mallorca" />
    <meta property="og:description" content="Yoga, pilates, gyms, spas and private instructors across Mallorca. One membership, credits at every partner venue." />
    <meta property="og:url" content="https://www.wello-wellness.com/" />
    <meta property="og:image" content="https://www.wello-wellness.com/favicon.svg" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wello — one wellness pass for Mallorca" />
    <meta name="twitter:description" content="Yoga, pilates, gyms, spas and private instructors across Mallorca. One membership, credits at every partner venue." />
    <meta name="twitter:image" content="https://www.wello-wellness.com/favicon.svg" />

    <title>Wello — one wellness pass for Mallorca</title>

    <!-- Organization schema. Gives Google the entity Wello is (and where it operates)
         so branded search and knowledge-panel signals attach to the right thing.
         Kept minimal — no physical address (marketplace, not brick-and-mortar). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Wello",
      "url": "https://www.wello-wellness.com",
      "logo": "https://www.wello-wellness.com/favicon.svg",
      "description": "Wellness pass for Mallorca — yoga, pilates, gyms, spas and private instructors on one membership.",
      "areaServed": { "@type": "Place", "name": "Mallorca, Spain" }
    }
    </script>
    <!-- Leaflet for the Explore map. Loaded from unpkg with subresource
         integrity hashes so a compromised CDN can't inject arbitrary JS.
         Used only on the Explore map view; window.L is nullable and the
         map component no-ops if the load ever fails. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
